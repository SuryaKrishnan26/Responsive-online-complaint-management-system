<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complaint Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EBF0F5; --surface:#FFFFFF; --surface-2:#F4F7FA; --ink:#0F1A2B; --muted:#586479; --line:#D3DBE5;
  --brand:#1D3FE0; --brand-ink:#FFFFFF; --brand-soft:#E3E9FF; --focus:#1D3FE0;
  --st-new:#1D4ED8; --st-new-bg:#E3EBFF;
  --st-prog:#8F4B00; --st-prog-bg:#FFEBCF;
  --st-res:#17692F; --st-res-bg:#DDF3E4;
  --st-clo:#4B5565; --st-clo-bg:#E5E9EF;
  --danger:#B42318; --danger-bg:#FDE7E4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B111A; --surface:#141C28; --surface-2:#1A2432; --ink:#E7ECF4; --muted:#9AA6B9; --line:#273245;
    --brand:#7C93FF; --brand-ink:#0B111A; --brand-soft:#1F2A52; --focus:#9DB0FF;
    --st-new:#9DB4FF; --st-new-bg:#1D2B5E;
    --st-prog:#FFC27A; --st-prog-bg:#4A3212;
    --st-res:#7FD99A; --st-res-bg:#173A24;
    --st-clo:#B4BDCB; --st-clo-bg:#2A3342;
    --danger:#FF9A8F; --danger-bg:#4A1D19;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B111A; --surface:#141C28; --surface-2:#1A2432; --ink:#E7ECF4; --muted:#9AA6B9; --line:#273245;
  --brand:#7C93FF; --brand-ink:#0B111A; --brand-soft:#1F2A52; --focus:#9DB0FF;
  --st-new:#9DB4FF; --st-new-bg:#1D2B5E;
  --st-prog:#FFC27A; --st-prog-bg:#4A3212;
  --st-res:#7FD99A; --st-res-bg:#173A24;
  --st-clo:#B4BDCB; --st-clo-bg:#2A3342;
  --danger:#FF9A8F; --danger-bg:#4A1D19;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-size:1.35rem}
h3{font-size:1.05rem;margin:26px 0 10px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:0 24px}
.brand{display:flex;align-items:center;gap:10px;padding:12px 0;font:700 1.2rem 'Bricolage Grotesque','Public Sans',sans-serif;letter-spacing:-.01em}
.brand svg{flex:none}
.tabs{display:flex;margin-left:auto}
.tab{background:none;border:0;padding:0 16px;min-height:52px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
@media (max-width:640px){
  .tabs{width:100%;margin-left:0}
  .tab{flex:1;padding:0 6px;font-size:.9rem}
}

main{padding:32px 0 56px}
.hero{padding:12px 0 28px;max-width:760px}
.hero h1{font-size:clamp(2rem,5.5vw,3.3rem);font-weight:700;letter-spacing:-.025em;line-height:1.05}
.hero p{margin-top:14px;font-size:1.125rem;color:var(--muted);max-width:56ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
@media (max-width:520px){.card{padding:18px}}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:960px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* forms */
.field{margin-top:18px;border:0;padding:0;min-width:0}
.field:first-child{margin-top:0}
label,legend{display:block;font-weight:600;font-size:.9375rem;margin-bottom:6px;padding:0}
.hint{color:var(--muted);font-size:.875rem;margin-top:6px}
.err{color:var(--danger);font-size:.875rem;margin-top:6px;font-weight:500}
input,select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:130px}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
[aria-invalid="true"]{border-color:var(--danger)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:620px){.row2{grid-template-columns:1fr}.row2 .field:nth-child(2){margin-top:18px}}
.count{float:right;font-weight:400;color:var(--muted);font-size:.8125rem}
.urg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.urg{grid-template-columns:1fr 1fr}}
.urg-opt{position:relative;margin:0;display:block;cursor:pointer}
.urg-opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.urg-opt span{display:block;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;height:100%}
.urg-opt b{display:block;font-size:.9375rem}
.urg-opt small{display:block;color:var(--muted);font-weight:400;font-size:.8125rem;line-height:1.35;margin-top:2px}
.urg-opt:has(input:checked) span{border-color:var(--brand);background:var(--brand-soft)}
.urg-opt:has(input:focus-visible) span{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 18px;min-height:44px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%;margin-top:22px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.link{background:none;border:0;padding:8px 0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:44px}

/* aside */
.side h2{font-size:1.1rem;margin-bottom:12px}
.side+.side{margin-top:16px}
.sla{list-style:none;margin:0;padding:0}
.sla li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.sla li:first-child{border-top:0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 38px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:.85rem;display:grid;place-items:center}

/* ticket stub */
.stub{padding-bottom:20px;animation:drop .35s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.stub-top{color:var(--st-res);font-weight:700;display:flex;align-items:center;gap:8px}
.stub-id{font:700 clamp(1.9rem,6vw,2.8rem)/1.1 'Bricolage Grotesque','Public Sans',sans-serif;letter-spacing:.01em;margin:10px 0 8px;word-break:break-word}
.perf{position:relative;margin:24px -24px;border-top:2px dashed var(--line)}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-11px}.perf::after{right:-11px}
@media (max-width:520px){.perf{margin:22px -18px}}
.stub dl,.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px;margin:0}
.stub dt,.meta dt{font-size:.8125rem;color:var(--muted)}
.stub dd,.meta dd{margin:0;font-weight:600;word-break:break-word}

/* chips */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8125rem;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-new{color:var(--st-new);background:var(--st-new-bg)}
.st-prog{color:var(--st-prog);background:var(--st-prog-bg)}
.st-res{color:var(--st-res);background:var(--st-res-bg)}
.st-clo{color:var(--st-clo);background:var(--st-clo-bg)}
.pri{display:inline-flex;align-items:center;gap:7px;font-size:.8125rem;font-weight:600}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.bars span{width:3px;border-radius:1px;background:var(--line)}
.bars span:nth-child(1){height:4px}.bars span:nth-child(2){height:7px}.bars span:nth-child(3){height:10px}.bars span:nth-child(4){height:12px}
.bars span.on{background:currentColor}
.p-low{color:var(--muted)}.p-medium{color:var(--st-new)}.p-high{color:var(--st-prog)}.p-urgent{color:var(--danger)}
.due{font-size:.8125rem;color:var(--muted);font-weight:500}
.due.over{color:var(--danger);font-weight:600}

/* track */
.lookup{max-width:640px}
.notice{margin-top:20px}
.notice.err{background:var(--danger-bg);border-color:transparent;color:var(--danger);font-weight:500}
.result{margin-top:24px;max-width:760px}
.result-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 16px;align-items:flex-start}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;margin:22px 0 0;padding:0}
.progress li{border-top:4px solid var(--line);padding-top:6px;font-size:.8125rem;color:var(--muted);font-weight:500}
.progress li.done{border-color:var(--brand)}
.progress li.now{border-color:var(--brand);color:var(--ink);font-weight:700}

/* timeline */
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;margin-left:6px;padding:0 0 18px 22px;border-left:2px solid var(--line)}
.timeline li:last-child{border-left-color:transparent;padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--brand)}
.timeline li.is-int::before{border-color:var(--muted)}
.ev-h{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.ev-h time{color:var(--muted);font-size:.8125rem}
.ev-b{margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.badge{font-size:.75rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.is-int .ev-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-top:6px}

/* staff */
.gate{max-width:440px;margin:24px auto}
.console-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;margin-bottom:18px}
.console-head h1{font-size:clamp(1.6rem,4vw,2.2rem)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media (max-width:720px){.tiles{grid-template-columns:1fr 1fr}}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;display:block;width:100%}
.tile:hover{border-color:var(--muted)}
.tile .n{display:block;font:700 2rem/1.1 'Bricolage Grotesque','Public Sans',sans-serif}
.tile .l{display:block;color:var(--muted);font-size:.875rem;font-weight:500}
.tile.alert .n{color:var(--danger)}
.staff-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:1000px){.staff-grid{grid-template-columns:minmax(0,1fr)}}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.filters .f-q{flex:2 1 220px}.filters .f-s{flex:1 1 140px}
.filters label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.count-line{display:flex;justify-content:space-between;color:var(--muted);font-size:.875rem;margin-bottom:8px}
.list{padding:0;overflow:hidden}
.rows-head,.row{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.2fr) 100px 120px 140px;gap:12px;align-items:center;padding:12px 16px}
.rows-head{font-size:.8125rem;color:var(--muted);font-weight:600;background:var(--surface-2)}
.row{width:100%;text-align:left;background:var(--surface);border:0;border-top:1px solid var(--line);cursor:pointer}
.rows-head+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.row b{display:block;font-weight:600;overflow-wrap:anywhere}
.row small{display:block;color:var(--muted);font-size:.8125rem}
.r-meta{display:flex;flex-wrap:wrap;gap:0 12px}
@media (max-width:860px){
  .rows-head{display:none}
  .row{display:flex;flex-wrap:wrap;gap:8px 14px;padding:14px 16px}
  .r-main{flex:1 1 100%}
  .r-cat small{display:inline;margin-left:8px}
}
.empty{padding:36px 20px;text-align:center}
.empty p{color:var(--muted);margin:6px 0 14px}
.catbar{margin-top:12px}
.catbar div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:.875rem}
.track-line{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);margin-top:5px;overflow:hidden}
.track-line i{display:block;height:100%;background:var(--brand)}

/* drawer */
dialog.drawer{margin:0 0 0 auto;padding:0;border:0;width:min(580px,100%);max-width:100%;height:100%;max-height:100%;background:var(--surface);color:var(--ink);border-left:1px solid var(--line)}
dialog.drawer::backdrop{background:rgba(8,12,20,.55)}
#drawerInner{display:flex;flex-direction:column;height:100%}
.dr-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 16px;border-bottom:1px solid var(--line)}
.dr-head h2{font-size:1.3rem;margin-top:4px;overflow-wrap:anywhere}
.dr-id{font-size:.875rem;color:var(--muted);font-weight:600}
.icon-btn{flex:none;width:44px;height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:1.4rem;line-height:1;cursor:pointer}
.dr-body{flex:1;overflow:auto;padding:18px 20px calc(28px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:18px}
.desc{white-space:pre-wrap;overflow-wrap:anywhere}
.manage{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.manage{grid-template-columns:1fr}}
.manage .field{margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 10px}
.seg label{display:flex;align-items:center;gap:8px;margin:0;font-weight:500;min-height:36px;cursor:pointer}
.seg input{width:auto;min-height:0;accent-color:var(--brand)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);padding:20px 0 28px;color:var(--muted);font-size:.875rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="var(--brand)"/><path d="M8 9.5h14a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5h-7.2L11 23v-3.5H8A1.5 1.5 0 0 1 6.5 18v-7A1.5 1.5 0 0 1 8 9.5z" fill="var(--brand-ink)"/><path d="m11.5 14.6 2.2 2.2 4.3-4.4" stroke="var(--brand)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Complaint Desk
    </div>
    <nav class="tabs" aria-label="Main">
      <button class="tab" data-act="tab" data-view="file" aria-current="page">File a complaint</button>
      <button class="tab" data-act="tab" data-view="track" aria-current="false">Track</button>
      <button class="tab" data-act="tab" data-view="staff" aria-current="false">Staff console</button>
    </nav>
  </div>
</header>

<main><div class="wrap" id="app"></div></main>

<footer><div class="wrap">This is a working demo. Complaints are saved only in this browser and are not sent to anyone.</div></footer>

<dialog class="drawer" id="drawer" aria-label="Complaint details"><div id="drawerInner"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const H=3600e3, YEAR=new Date().getFullYear();
const STATUSES=['New','In progress','Resolved','Closed'];
const PRIORITIES=['Low','Medium','High','Urgent'];
const SLA={Low:240,Medium:120,High:48,Urgent:24};
const SLA_TEXT={Low:'10 days',Medium:'5 days',High:'2 days',Urgent:'24 hours'};
const URG=[['Low','Can wait'],['Medium','Normal'],['High','Needs attention'],['Urgent','Safety or legal risk']];
const CATEGORIES=['Billing and payments','Service quality','Product defect','Staff conduct','Delivery and logistics','Facilities and safety','Other'];
const STAFF=['Unassigned','Asha Raman','Karthik Iyer','Meera Nair','Dev Patel'];
const PASSCODE='staff123';
const KEY='complaintDesk.v1';
const ST_CLASS={'New':'st-new','In progress':'st-prog','Resolved':'st-res','Closed':'st-clo'};

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dtf=new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const fmt=t=>dtf.format(new Date(t));
const dur=ms=>{const h=Math.max(1,Math.round(ms/H));return h<48?h+' h':Math.round(h/24)+' d';};
const isOpen=c=>c.status==='New'||c.status==='In progress';
const dueTime=c=>(c.dueFrom||c.createdAt)+SLA[c.priority]*H;
function dueInfo(c){
  if(!isOpen(c))return{label:c.status==='Closed'?'Closed':'Completed',over:false,t:Infinity};
  const d=dueTime(c)-Date.now();
  return d<0?{label:'Overdue by '+dur(-d),over:true,t:dueTime(c)}:{label:'Due in '+dur(d),over:false,t:dueTime(c)};
}
const pill=s=>`<span class="pill ${ST_CLASS[s]||''}"><i></i>${esc(s)}</span>`;
const pri=p=>{const n=PRIORITIES.indexOf(p)+1;return `<span class="pri p-${esc(p.toLowerCase())}"><span class="bars" aria-hidden="true">${[1,2,3,4].map(i=>`<span class="${i<=n?'on':''}"></span>`).join('')}</span>${esc(p)}</span>`;};

/* ---------- data ---------- */
function seed(){
  const now=Date.now();
  const mk=(n,name,cat,priority,subject,description,location,status,assignee,ago,evs)=>{
    const created=now-ago*H;
    const c={id:`CMP-${YEAR}-${String(n).padStart(4,'0')}`,name,email:name.split(' ')[0].toLowerCase()+'@example.com',phone:'',category:cat,priority,subject,description,location,status,assignee,createdAt:created,events:[{t:created,type:'created',text:'Complaint received',by:name}]};
    (evs||[]).forEach(e=>c.events.push({t:created+e[0]*H,type:e[1],text:e[2],by:e[3]}));
    c.updatedAt=c.events[c.events.length-1].t;
    return c;
  };
  return [
    mk(1,'Priya Menon','Billing and payments','High','Charged twice for the October subscription','I was billed Rs 1,499 twice on 3 October. Both charges show on my bank statement, but the app lists only one invoice.','Online','In progress','Asha Raman',30,[
      [2,'status','Status changed to In progress','Support team'],
      [3,'public','We found the duplicate charge and started a refund. It should reach your account in 3 to 5 working days.','Support team'],
      [4,'internal','Gateway confirms duplicate capture. Refund reference RF-8841.','Staff']]),
    mk(2,'Rahul Sharma','Delivery and logistics','Medium','Parcel marked delivered but never arrived','Tracking says my parcel was delivered on Tuesday at 2 pm. Nobody was home and no neighbour received it.','Coimbatore','New','Unassigned',5),

function syncFilters(){
  const f=state.f;
  const set=(id,v)=>{const el=$(id);if(el)el.value=v;};
  set('#fQ',f.q);set('#fStatus',f.status);set('#fPri',f.priority);set('#fCat',f.category);set('#fSort',f.sort);
}
function filtered(){
  const f=state.f,q=f.q.trim().toLowerCase();
  let list=state.complaints.filter(c=>{
    if(f.status==='open'&&!isOpen(c))return false;
    if(f.status==='overdue'&&!dueInfo(c).over)return false;
    if(f.status==='unassigned'&&!(isOpen(c)&&c.assignee==='Unassigned'))return false;
    if(STATUSES.includes(f.status)&&c.status!==f.status)return false;
    if(f.priority!=='all'&&c.priority!==f.priority)return false;
    if(f.category!=='all'&&c.category!==f.category)return false;
    if(q&&!(c.id+' '+c.name+' '+c.subject+' '+c.email).toLowerCase().includes(q))return false;
    return true;
  });
  const s=f.sort;
  list.sort((a,b)=>{
    if(s==='oldest')return a.createdAt-b.createdAt;
    if(s==='due')return dueInfo(a).t-dueInfo(b).t;
    if(s==='priority')return PRIORITIES.indexOf(b.priority)-PRIORITIES.indexOf(a.priority)||dueInfo(a).t-dueInfo(b).t;
    return b.createdAt-a.createdAt;
  });
  return list;
}

  $('#stats').innerHTML=tile(open,'Open','open')+tile(over,'Overdue','overdue',true)+tile(un,'Unassigned','unassigned')+tile(done,'Resolved or closed','Resolved');
  const list=filtered();
  $('#count').textContent=`Showing ${list.length} of ${all.length} complaints`;
  $('#list').innerHTML=list.length?`<div class="rows-head" aria-hidden="true"><span>Complaint</span><span>Category</span><span>Priority</span><span>Status</span><span>Due</span></div>`+list.map(c=>{

drawer.addEventListener('close',()=>{state.openId=null;});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='tab')go(t.dataset.view);
  else if(a==='open')openDrawer(id);
  else if(a==='close-drawer')drawer.close();
  else if(a==='copy-id')copy(id);
  else if(a==='track-this'){const c=get(id);state.prefill={id,email:c?c.email:''};go('track');}
  else if(a==='file-another')renderFile();
  else if(a==='signout'){state.staff=false;try{sessionStorage.removeItem('cd.staff');}catch(x){}renderStaff();}
  else if(a==='reset'){
    if(!state.resetArmed){state.resetArmed=true;t.textContent='Click again to confirm reset';setTimeout(()=>{state.resetArmed=false;const b=$('#resetBtn');if(b)b.textContent='Reset demo data';},4000);}
    else{state.resetArmed=false;state.complaints=seed();state.f=defaultF();save();renderStaff();toast('Demo data restored');}
  }
  else if(a==='tile'){state.f=Object.assign(defaultF(),{status:t.dataset.v});syncFilters();updateStaff();}
  else if(a==='clear'){state.f=defaultF();syncFilters();updateStaff();}
  else if(a==='reopen-toggle'){const f=$('#reopenForm');f.hidden=!f.hidden;if(!f.hidden)$('#r-reason').focus();}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='complaintForm')submitComplaint(f);
  else if(f.id==='trackForm')lookup($('#t-id').value,$('#t-email').value);
  else if(f.id==='loginForm'){
    if($('#s-pass').value===PASSCODE){state.staff=true;try{sessionStorage.setItem('cd.staff','1');}catch(x){}renderStaff();}
    else{$('#s-err').hidden=false;$('#s-pass').setAttribute('aria-invalid','true');$('#s-pass').focus();}
  }
  else if(f.id==='replyForm'){
    const c=get(state.openId);if(!c)return;
    const text=f.text.value.trim(),kind=f.kind.value;
    if(text.length<2){$('#d-err').hidden=false;f.text.focus();return;}
    addEv(c,kind==='public'?'public':'internal',text,kind==='public'?'Support team':'Staff');
    save();updateStaff();renderDrawer();
    toast(kind==='public'?'Reply posted':'Note added');
  }
  else if(f.id==='reopenForm'){
    const r=$('#r-reason').value.trim();
    if(r.length<3){$('#r-err').hidden=false;$('#r-reason').focus();return;}
    const t=state.track,c=t&&state.complaints.find(x=>x.id===String(t.id).trim().toUpperCase());
    if(!c)return;
    c.status='New';c.dueFrom=Date.now();
    addEv(c,'public','Reopened by you: '+r,c.name);
    addEv(c,'status','Status changed to New',c.name);
    save();lookup(t.id,t.email);toast('Complaint reopened');
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-description'){$('#count').textContent=t.value.length+' / 1500';}
  else if(t.id==='fQ'){state.f.q=t.value;updateStaff();}
  if(t.classList&&t.hasAttribute('aria-invalid')&&t.value.trim()&&t.id.startsWith('f-'))setErr(t.id.slice(2),'');
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fStatus'){state.f.status=t.value;updateStaff();}
  else if(t.id==='fPri'){state.f.priority=t.value;updateStaff();}
  else if(t.id==='fCat'){state.f.category=t.value;updateStaff();}
  else if(t.id==='fSort'){state.f.sort=t.value;updateStaff();}
  else if(t.dataset&&t.dataset.field){applyChange(get(state.openId),t.dataset.field,t.value);}
});

go('file');
})();
</script>
</body>
</html>
